<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#24242b"/>
      <stop offset="100%" stop-color="#0f0f13"/>
    </radialGradient>
    <linearGradient id="spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10a37f"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="emerald-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="50" cy="50" r="46" fill="url(#bg-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Subtle Inner Glow -->
  <circle cx="50" cy="50" r="28" fill="rgba(16, 163, 127, 0.15)" filter="url(#emerald-glow)"/>

  <!-- Nexora 4-Point Emerald Spark -->
  <path d="M50 20 C50 36.5685 63.4315 50 80 50 C63.4315 50 50 63.4315 50 80 C50 63.4315 36.5685 50 20 50 C36.5685 50 50 36.5685 50 20 Z" 
        fill="url(#spark-grad)" 
        filter="url(#emerald-glow)"/>
</svg>
